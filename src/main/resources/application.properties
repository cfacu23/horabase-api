spring.application.name=horabase-api

spring.datasource.url=jdbc:postgresql://localhost:5432/horabase
spring.datasource.username=horabase
spring.datasource.password=horabase123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# Máxima distancia entre la entrada y el inicio de un turno para asociarlo automáticamente.
attendance.shift-match-window-minutes=${ATTENDANCE_SHIFT_MATCH_WINDOW_MINUTES:240}

horabase.jwt.secret=${JWT_SECRET}
horabase.jwt.issuer=${JWT_ISSUER:horabase-api}
horabase.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

horabase.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
horabase.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}
horabase.mail.from=${MAIL_FROM:no-reply@horabase.local}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
