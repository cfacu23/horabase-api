services:
  postgres:
    image: postgres:16-alpine
    container_name: horabase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: horabase
      POSTGRES_USER: horabase
      POSTGRES_PASSWORD: horabase123
    ports:
      - "5432:5432"
    volumes:
      - horabase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horabase -d horabase"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  horabase_postgres_data: